original: Every future grammar ADR must justify its choice against these three criteria, in this order.
context_before: 'Enforcement hierarchy: the primary tool is the set of valid sentence structures — comprehension properties (notably right-branching, which the head-initial templates make structurally inevitable) are built into the grammar, so bad shapes are unwritable rather than merely penalized. Scoring parsed sentences is the secondary tool: it verifies the claim empirically, monitors residual load, and gathers the evidence for future bounds — it is not the mechanism that keeps text readable.'
context_after: Metrics for (1) already exist in the research findings and can be implemented over parse output when the grammar tier arrives.
