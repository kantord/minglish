er. The text should not be robotic. The expressiveness does not override the 3 criteria. If 2 valid Formulations tie on the load, then the Grammar prefers the most expressive Formulation. If 2 valid Formulations tie on the density, then the Grammar prefers the most expressive Formulation. If 2 valid Formulations tie on the Context Need, then the Grammar prefers the most expressive Formulation. The Grammar does not trade precision for the charisma. "Natural-sounding" loses to "measurably easier". The 2nd criterion keeps the loss small.
