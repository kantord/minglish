- text: The Grammar has 3 criteria for every decision about a Sentence Shape. Every future Grammar ADR must justify the choice against the criteria, in this order. The first criterion is the Cognitive Load. Every Sentence Shape must minimize the Open Dependencies, the Dependency Length, and the Embedding Depth. The branching rules exist to help human readers and Language Models. The rules do not exist for taste or tradition. The second criterion is the Familiarity of the construction. If the ideal branching is not available, then the Grammar uses the most common pattern of English. The Familiarity is a processing aid. The Surprise is a cost. The third criterion is the Context Need. A sentence must need as little prior context as possible. The language bans every Anaphoric Pronoun (ADR 0002). The writer repeats every noun. The scope rules are fixed. The criteria have a corollary. The constraints are bounds. The Grammar does not ban a Sentence Shape. A rule forces longer text only if the rule removes more Ambiguity than the length costs. The length is cheaper than the load, but the length is not free. The enforcement hierarchy has 2 tools. The primary tool is the set of valid Sentence Shapes. The Grammar makes a bad Sentence Shape unwritable. The secondary tool is the scoring of a Parse. The scoring verifies the claim. The scoring monitors the residual load. The scoring gathers evidence for future bounds. The scoring does not keep the text readable. The metrics for the first criterion exist in the research findings. The Linter can implement the metrics over the Parse output. The goal of the language is precise, dense text. The text must be cheap to process. The shortest formulation inside the load bounds is the best. Verbosity adds noise. Noise creates Ambiguity. The rules that force extra words are justified only if they remove more Ambiguity than the added length costs. Expressiveness is a subordinate goal. The text should be pleasant to read. The text should not be robotic. Expressiveness does not override the 3 criteria. If 2 valid formulations tie on the load, the density, and the Context Need, then the Grammar prefers the more expressive one. The Grammar never trades precision for charisma. "Natural-sounding" loses to "measurably easier" when the 2 conflict. The second criterion keeps the loss small.
