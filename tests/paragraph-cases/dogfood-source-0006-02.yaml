- text: Every syntactic decision uses 3 criteria. The criteria come in an order. The first criterion is the Cognitive Load. Prefer the structure that minimizes the Open Dependencies, the Dependency Length, and the Embedding Depth. The branching rules exist to aid the human and the Language Model. The rules do not exist for the taste or the tradition. The second criterion is the familiar construction. When the ideal branching is unavailable, choose the most frequent standard pattern. The familiarity is a processing aid. The surprise is a cost. The third criterion is the Context Need. A sentence must need as little prior context as possible. The language bans the Anaphoric Pronoun for this reason. The writer repeats every noun for this reason. The scope rules are fixed for this reason.
