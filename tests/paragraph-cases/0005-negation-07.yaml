source: docs/adr/0005-negation.md
index: 7
original: The Grammar fixes the scope of "not". The word "not" changes the truth of the main verb. The word "not" does not change a Constituent. The language bans a Negation of a Constituent. The phrase "not all users" is one example. The phrase "a not old file" is one example.
context_before: A Negation of a Copula uses "is not" or uses "are not". A Negation of a Copula does not need an Auxiliary.
context_after: The decision did not enable "did". The decision "0010" added "did". The language bans every contraction. The word "doesn't" is a contraction. The word "don't" is a contraction.
