source: docs/dogfood-source-0006.md
index: 7
original: Expressiveness, subordinate. Sounding natural, charismatic, and expressive is a genuine goal — minglish text should be pleasant to read, not robotic — but it never overrides criteria 1–4. Where two valid formulations tie on load, density, and context need, prefer the more expressive one; never trade precision or clarity for charisma.
context_before: 'Density within the bounds. The target is precise, meaning-dense text that is nonetheless cheap to process: prefer the shortest formulation that stays inside the load bounds. Verbosity is not free — text that under-compresses its meaning adds noise, and noise creates its own reading ambiguity. Rules that force extra words (repeated nouns, mandatory then) are justified only because they remove more ambiguity than the added length costs; a rule that pads without disambiguating fails this criterion.'
context_after: 'Corollaries: constraints are stated as bounds (e.g. fronted material limited by weight) rather than bans on shapes; and when a rule forces longer text, the trade must be earned — length is cheaper than load, but never free.'
