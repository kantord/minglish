original: A Negation of a verb needs the word "do" in English. The word "do" is an Auxiliary. The language avoids Auxiliaries. The word "not" can change one Constituent. The phrase "not all users" is one example. The phrase "not old" is one example. A Negation of a Constituent causes a Scope Ambiguity.
context_before: Triage counts about 204 tokens of the word "not" in the corpus. Instructions need Prohibitions. The sentence "do not delete the file" is a Prohibition.
