original: The prose repeats the nouns. The repetition is an acceptable expense. The project prefers the clarity of the prose to the naturalness of the prose.
context_before: The design of the language removes every Reference Ambiguity. The language does not have a Discourse Layer, so the maintainers do not build a Discourse Layer.
context_after: The Lexicon contains a Ban for every Anaphoric Pronoun. The Linter explains the Ban to the writer. The Linter says "repeat the noun you mean".
