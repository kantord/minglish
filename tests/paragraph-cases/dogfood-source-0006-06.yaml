source: docs/dogfood-source-0006.md
index: 6
original: 'Density within the bounds. The target is precise, meaning-dense text that is nonetheless cheap to process: prefer the shortest formulation that stays inside the load bounds. Verbosity is not free — text that under-compresses its meaning adds noise, and noise creates its own reading ambiguity. Rules that force extra words (repeated nouns, mandatory then) are justified only because they remove more ambiguity than the added length costs; a rule that pads without disambiguating fails this criterion.'
context_before: Minimal context need. A sentence should be interpretable with as little prior context as possible. This is why anaphora is banned (ADR 0002), why nouns are repeated, and why scope rules are fixed rather than context-dependent.
context_after: Expressiveness, subordinate. Sounding natural, charismatic, and expressive is a genuine goal — minglish text should be pleasant to read, not robotic — but it never overrides criteria 1–4. Where two valid formulations tie on load, density, and context need, prefer the more expressive one; never trade precision or clarity for charisma.
