source: docs/dogfood-source-0006.md
index: 1
original: 'Grammar decisions need a tie-breaker. Our research findings (docs/research/cnl-design-findings.md) ground sentence difficulty in measurable cognitive load: peak simultaneously-open dependencies (comfortable ceiling ≈4), dependency length, and center-embedding depth predict "hard to mentally unpack" better than any stylistic rule. They also showed categorical structural bans overshoot — a heavily left-branching sentence was effortless when it carried little load — so the right constraints are load bounds, not shape prohibitions. Human readers and LLMs share the relevant profile: both integrate left-to-right under a bounded working context.'
context_before: ''
context_after: 'Ranked criteria for every syntactic-structure decision, in order:'
