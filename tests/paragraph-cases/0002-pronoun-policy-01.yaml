index: 1
original: 'Triage against UD-EWT (docs/triage-report.md) shows pronouns are ~2,200 of the OOV tokens — the second-largest closed-class gap. But third-person pronouns are anaphoric: resolving "it failed" requires a discourse layer, and our research findings identify cross-sentence reference as exactly where ambiguity reappears after sentences are split (docs/research/cnl-design-findings.md, "Ambiguity migrates"). First- and second-person pronouns are indexical (speaker/hearer), never anaphoric, and carry no reference ambiguity; instructional text uses them constantly.'
context_before: ''
context_after: 'Banned: all anaphoric pronouns and pronominal demonstratives (it, they, he, she, this, that, these, those, and their object/possessive forms). The writer repeats the noun instead.'
